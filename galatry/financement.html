<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Financement Galatry 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F5F4; --sheet:#FBFCFB; --ink:#1B2530; --ink-2:#56626E; --rule:#C9D1D4;
  --room:#E6ECEE; --accent:#2F6690;
  --good:#0C7A3D; --good-soft:rgba(12,122,61,.12); --critical:#B3402A; --critical-soft:rgba(179,64,42,.12); --warning:#B8860B; --warning-soft:rgba(184,134,11,.16);
  --f-draw:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10161B; --sheet:#151D23; --ink:#DCE4E9; --ink-2:#93A1AB; --rule:#2B3740;
    --room:#1C262E; --accent:#7DB4E0;
    --good:#3FBE72; --good-soft:rgba(63,190,114,.16); --critical:#E2725B; --critical-soft:rgba(226,114,91,.16); --warning:#E0B93D; --warning-soft:rgba(224,185,61,.18);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10161B; --sheet:#151D23; --ink:#DCE4E9; --ink-2:#93A1AB; --rule:#2B3740;
  --room:#1C262E; --accent:#7DB4E0;
  --good:#3FBE72; --good-soft:rgba(63,190,114,.16); --critical:#E2725B; --critical-soft:rgba(226,114,91,.16); --warning:#E0B93D; --warning-soft:rgba(224,185,61,.18);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--f-draw);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.5vw,40px);line-height:1.08}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
p{margin:0;max-width:70ch}
.muted{color:var(--ink-2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:20px}
.kicker{font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--accent);margin-bottom:6px}
.cartouche{display:grid;grid-template-columns:auto auto;border:1.5px solid var(--ink);font-family:var(--f-draw);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.cartouche div{padding:5px 12px;border-bottom:1px solid var(--rule)}
.cartouche div:nth-child(odd){color:var(--ink-2);border-right:1px solid var(--rule)}
.cartouche div:nth-last-child(-n+2){border-bottom:0}
.lede{display:flex;flex-direction:column;gap:10px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);padding:6px 12px;border-radius:2px;background:var(--sheet)}
nav a:hover,nav a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
@media (max-width:720px){header{grid-template-columns:1fr}}

section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px}

.panel{background:var(--sheet);border:1px solid var(--rule);padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 28px}
.field{display:flex;flex-direction:column;gap:4px}
.field-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.field label{font-size:.82rem;color:var(--ink-2)}
.field .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--ink);font-weight:600}
.field .hint{font-size:.74rem;color:var(--ink-2)}
input[type="range"]{width:100%;accent-color:var(--accent)}
input[type="number"]{width:100%;border:1px solid var(--rule);padding:6px 9px;background:var(--room);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets span{font-size:.8rem;color:var(--ink-2);margin-right:4px}
.presets button{border:1px solid var(--rule);background:var(--room);color:var(--ink);padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.presets button:hover,.presets button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}

.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.callout{background:var(--room);padding:10px 14px;display:flex;flex-direction:column;gap:2px;border-left:3px solid transparent}
.callout.good{border-left-color:var(--good)}
.callout.bad{border-left-color:var(--critical)}
.callout .k{font-family:var(--f-draw);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.callout .n{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.callout .s{font-size:.8rem;color:var(--ink-2)}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{font-size:.86rem;padding:8px 12px}
.flag.bad{background:var(--critical-soft);color:var(--critical)}
.flag.warn{background:var(--warning-soft);color:color-mix(in srgb,var(--warning) 60%,var(--ink) 40%)}
.flag.ok{background:var(--good-soft);color:var(--good)}

.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.05em;font-size:.74rem;color:var(--ink-2);font-weight:600;vertical-align:bottom}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
tr.total td{font-weight:600;border-top:1.5px solid var(--ink)}
tr.sub td{color:var(--ink-2);font-size:.8rem}
tr.cur td{background:var(--room);font-weight:600}
td.bad{color:var(--critical)}
td.good{color:var(--good)}

details.assumptions{background:var(--sheet);border:1px solid var(--rule);padding:4px 20px}
details.assumptions summary{cursor:pointer;padding:14px 0;font-family:var(--f-draw);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
details.assumptions[open] summary{border-bottom:1px solid var(--rule);margin-bottom:16px}
.assumption-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding-bottom:18px}
.assumption-group{display:flex;flex-direction:column;gap:10px}
.assumption-group h3{color:var(--accent)}
.reset{align-self:flex-start;border:1px solid var(--rule);background:var(--room);color:var(--ink-2);padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer;margin-bottom:16px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.note{background:var(--sheet);border:1px solid var(--rule);padding:14px 18px}
.note h3{margin-bottom:6px}
.note ul{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
.note a{color:var(--accent)}
</style>
</head>

const KEY = 'galatry-financement-v1';
let S = Object.assign({}, DEF);
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) Object.assign(S, s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

const chf = n => (n < 0 ? '−' : '') + Math.round(Math.abs(n)).toLocaleString('de-CH');
const k = n => { const a = Math.abs(n); const s = n < 0 ? '−' : ''; return a >= 1e6 ? s + (a/1e6).toFixed(2).replace(/0$/,'') + ' M' : s + Math.round(a/1000) + 'k'; };
const pct = (n, d=1) => (n*100).toFixed(d);
const fill = (s, o) => s.replace(/\{(\w)\}/g, (_, x) => o[x]);

// Core model. E = equity, R = renovation budget.
function model(E, R){
  const P = +S.P, fees = P * S.fees/100, r = S.rate/100;
  const V = P + R * S.bankPct/100;
  const M = Math.max(0, P + fees + R - E);
  const ltv = M / V;
  const amort = Math.max(0, M - V*2/3) / 15;
  const theo = M*0.05 + V*0.01 + amort;
  const reqInc = theo / 0.33;
  const hard = E - S.p2 - fees;
  const interest = M * r;
  const yrs = [S.split/100, 1 - S.split/100].map(sh => {
    const works = R * sh, dedW = works * S.ded/100;
    const maint = Math.max(0.3 * S.vl, dedW);
    let dTax = S.marg/100 * (S.vl - interest - maint);
    dTax = Math.max(dTax, -S.curTax);
    const cost = interest + amort + +S.charges + dTax;
    return {works, dedW, dTax, cost};
  });
  const up = V * S.upkeep/100;
  const cost29 = interest + amort + up + +S.charges;
  return {P, fees, V, M, ltv, amort, theo, reqInc, hard, interest, yrs, up, cost29, taxSaved: -(yrs[0].dTax + yrs[1].dTax), E, R};
}
function ok(m){
  if (m.ltv > 0.8 + 1e-9) return false;
  if (m.hard < 0.1*m.V) return false;
  if (S.income !== '' && +S.income > 0 && m.theo > 0.33 * S.income) return false;
  return true;
}
function maxReno(E){
  if (!ok(model(E, 0))) return 0;
  let lo = 0, hi = 6e6;
  if (ok(model(E, hi))) return hi;
  for (let i = 0; i < 50; i++){ const mid = (lo+hi)/2; ok(model(E, mid)) ? lo = mid : hi = mid; }
  return Math.floor(lo/1000)*1000;
}

// ---------- render shell ----------
const app = document.getElementById('app');
const fieldRange = (id, label, hint, min, max, step) => `<div class="field"><div class="field-row"><label for="${id}">${label}</label><span class="val" id="${id}-v"></span></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}">${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const fieldNum = (id, label, hint, step) => `<div class="field"><label for="${id}">${label}</label><input type="number" id="${id}" step="${step||'any'}" inputmode="decimal">${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const A = T.a;
app.innerHTML = `
<header>
  <div class="lede">
    <div class="kicker">${T.kicker}</div>
    <h1>${T.h1}</h1>
    <p class="muted">${T.lede}</p>
    <nav aria-label="Sections">${T.nav.map(([h,l]) => `<a href="${h}">${l}</a>`).join('')}</nav>
  </div>
  <div class="cartouche" id="cart"></div>
</header>
<section id="levers">
  <div class="sec-head"><h2>${T.levers}</h2><span class="muted" style="font-size:.84rem">${T.leversSub}</span></div>
  <div class="panel">
    <div class="levers">
      ${fieldRange('E', T.eq, T.eqHint, 200000, 1500000, 10000)}
      ${fieldRange('R', T.reno, T.renoHint, 0, 2500000, 5000)}
      ${fieldRange('ded', T.ded, T.dedHint, 0, 100, 5)}
      ${fieldRange('split', T.split, T.splitHint, 0, 100, 5)}
    </div>
    <div class="presets"><span>${T.presets}</span>${T.pr.map(([l,v]) => `<button type="button" data-preset="${v}">${l}</button>`).join('')}</div>
  </div>
</section>
<section id="result">
  <div class="sec-head"><h2>${T.result}</h2><span class="muted" style="font-size:.84rem">${T.resultSub}</span></div>
  <div class="callouts" id="callouts"></div>
  <div class="flags" id="flags"></div>
  <h3>${T.bd}</h3>
  <div class="tbl-wrap"><table id="bd"></table></div>
  <p class="muted" style="font-size:.8rem">${T.bdNote}</p>
</section>
<section id="equity">
  <div class="sec-head"><h2>${T.eqH}</h2><span class="muted" style="font-size:.84rem">${T.eqSub}</span></div>
  <div class="tbl-wrap"><table id="eqt"></table></div>
</section>
<details class="assumptions" id="assumptions">
  <summary>${T.asm}</summary>
  <div class="assumption-groups">
    <div class="assumption-group"><h3>${T.g.buy}</h3>${fieldNum('P', A.price, '', 10000)}${fieldNum('fees', A.fees, A.feesH, 0.1)}${fieldNum('p2', A.p2, '', 10000)}</div>
    <div class="assumption-group"><h3>${T.g.bank}</h3>${fieldNum('rate', A.rate, A.rateH, 0.05)}${fieldNum('bankPct', A.bankPct, A.bankPctH, 5)}${fieldNum('income', A.income, A.incomeH, 10000)}</div>
    <div class="assumption-group"><h3>${T.g.tax}</h3>${fieldNum('marg', A.marg, A.margH, 1)}${fieldNum('curTax', A.curTax, '', 1000)}${fieldNum('vl', A.vl, A.vlH, 1000)}</div>
    <div class="assumption-group"><h3>${T.g.own}</h3>${fieldNum('upkeep', A.upkeep, '', 0.1)}${fieldNum('charges', A.charges, '', 500)}${fieldNum('ref', A.ref, A.refH, 50)}${fieldNum('opp', A.opp, '', 0.5)}</div>
  </div>
  <button type="button" class="reset" id="reset">${T.reset}</button>
</details>
<section id="notes">
  <div class="sec-head"><h2>${T.notesH}</h2></div>
  <div class="notes">${T.notes.map(([h, li]) => `<div class="note"><h3>${h}</h3><ul>${li.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
</section>`;

const IDS = Object.keys(DEF);
function syncInputs(){ IDS.forEach(id => { const el = document.getElementById(id); if (el) el.value = S[id]; }); }
IDS.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { S[id] = id === 'income' && el.value === '' ? '' : +el.value; save(); update(); });
});
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  const p = b.dataset.preset, fees = S.P * S.fees/100;
  if (p === 'credit') { S.R = Math.max(0, Math.round((1700000 - S.P - fees + S.E)/1000)*1000); S.ded = 75; }
  if (p === 'energy') { S.R = 500000; S.ded = 65; }
  if (p === 'a') { S.R = 1193700; S.ded = 23; }   // costs.py mid, variant A; deductible = heat pump, glazing, half the lower-floor refit
  if (p === 'b') { S.R = 1371600; S.ded = 20; }   // costs.py mid, variant B
  save(); syncInputs(); update();
}));
document.getElementById('reset').addEventListener('click', () => { S = Object.assign({}, DEF); save(); syncInputs(); update(); });

function update(){
  const m = model(S.E, S.R), maxR = maxReno(S.E);
  document.getElementById('E-v').textContent = 'CHF ' + chf(S.E);
  document.getElementById('R-v').textContent = 'CHF ' + chf(S.R);
  document.getElementById('ded-v').textContent = S.ded + ' %';
  document.getElementById('split-v').textContent = S.split + ' / ' + (100 - S.split);
  document.getElementById('cart').innerHTML = [[T.cart[0], chf(S.P)], [T.cart[1], chf(S.E)], [T.cart[2], chf(m.M)], [T.cart[3], chf(S.R)]].map(([a,b]) => `<div>${a}</div><div>CHF ${b}</div>`).join('');

  const m27 = (m.yrs[0].cost + m.yrs[1].cost) / 24, m29 = m.cost29 / 12;
  const incOK = S.income === '' || !(+S.income > 0) ? null : m.theo <= 0.33 * S.income;
  const C = T.c, cl = [
    [C.mort, 'CHF ' + chf(m.M), pct(m.ltv) + ' % ' + C.ltv, m.ltv > 0.8 ? 'bad' : 'good'],
    [C.maxR, 'CHF ' + chf(maxR), C.maxRs, S.R > maxR ? 'bad' : 'good'],
    [C.m27, 'CHF ' + chf(m27), C.m27s, ''],
    [C.m29, 'CHF ' + chf(m29), C.m29s, ''],
    [C.tax, 'CHF ' + chf(m.taxSaved), pct(m.taxSaved / (2*S.curTax), 0) + ' % ' + C.taxs, m.taxSaved > 0 ? 'good' : ''],
    [C.inc, 'CHF ' + chf(m.reqInc), C.incs, incOK === null ? '' : incOK ? 'good' : 'bad']];
  document.getElementById('callouts').innerHTML = cl.map(([a,b,c,d]) => `<div class="callout ${d}"><span class="k">${a}</span><span class="n">${b}</span><span class="s">${c}</span></div>`).join('');

  const F = T.f, fl = [];
  if (m.M === 0) fl.push(['ok', F.neg]);
  else if (m.ltv > 0.8) { const V = m.V, short = m.M - 0.8*V; fl.push(['bad', fill(F.ltv, {x: pct(m.ltv), y: 'CHF ' + chf(short), z: 'CHF ' + chf(maxR)})]); }
  else fl.push(['ok', fill(F.ltvOk, {x: pct(m.ltv)})]);
  if (m.hard < 0.1*m.V) fl.push(['bad', fill(F.hard, {x: 'CHF ' + chf(m.hard), y: 'CHF ' + chf(0.1*m.V)})]);
  if (incOK === null) fl.push(['warn', F.noInc]);
  else fl.push([incOK ? 'ok' : 'bad', fill(incOK ? F.incOk : F.inc, {x: 'CHF ' + chf(m.theo), y: pct(m.theo / S.income)})]);
  document.getElementById('flags').innerHTML = fl.map(([c,t]) => `<div class="flag ${c}">${t}</div>`).join('');

  const Rw = T.rows, y = m.yrs, dash = '–';
  const row = (l, a, b, c, cls='') => `<tr class="${cls}"><td>${l}</td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
  const taxCls = v => v < 0 ? 'good' : v > 0 ? 'bad' : '';
  document.getElementById('bd').innerHTML = `<thead><tr>${T.bdCols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>` +
    row(fill(Rw.int, {r: S.rate}), chf(m.interest), chf(m.interest), chf(m.interest)) +
    row(Rw.am, chf(m.amort), chf(m.amort), chf(m.amort)) +
    row(Rw.up, dash, dash, chf(m.up)) +
    row(Rw.ch, chf(S.charges), chf(S.charges), chf(S.charges)) +
    `<tr><td>${Rw.tax}</td><td class="${taxCls(y[0].dTax)}">${chf(y[0].dTax)}</td><td class="${taxCls(y[1].dTax)}">${chf(y[1].dTax)}</td><td>0</td></tr>` +
    row(Rw.tot, chf(y[0].cost), chf(y[1].cost), chf(m.cost29), 'total') +
    row(Rw.mo, chf(y[0].cost/12), chf(y[1].cost/12), chf(m.cost29/12), 'total') +
    row(fill(Rw.ref, {x: chf(S.ref)}), chf(S.ref*12), chf(S.ref*12), chf(S.ref*12), 'sub') +
    row(fill(Rw.opp, {r: S.opp}), chf(S.E*S.opp/100), chf(S.E*S.opp/100), chf(S.E*S.opp/100), 'sub') +
    row(Rw.work, chf(y[0].works), chf(y[1].works), dash, 'sub') +
    row(Rw.dedr, chf(y[0].dedW), chf(y[1].dedW), dash, 'sub') + '</tbody>';

  const steps = [];
  for (let e = 300000; e <= 1200000; e += 100000) steps.push(e);
  if (!steps.includes(+S.E)) steps.push(+S.E);
  steps.sort((a,b) => a-b);
  document.getElementById('eqt').innerHTML = `<thead><tr>${T.eqCols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>` + steps.map(e => {
    const q = model(e, S.R), mr = maxReno(e);
    return `<tr class="${e === +S.E ? 'cur' : ''}"><td class="num">${chf(e)}</td><td>${chf(q.M)}</td><td class="${q.ltv > 0.8 ? 'bad' : ''}">${pct(q.ltv, 0)} %</td><td class="${S.R > mr ? 'bad' : 'good'}">${chf(mr)}</td><td>${chf((q.yrs[0].cost + q.yrs[1].cost)/24)}</td><td>${chf(q.cost29/12)}</td><td>${chf(q.taxSaved)}</td><td>${chf(q.reqInc)}</td></tr>`;
  }).join('') + '</tbody>';
}
syncInputs(); update();
})();
</script>
</body>
</html>
